name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for test workflows
permissions:
  contents: read

jobs:
  frontend-tests:
    name: React Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  rust-tests:
    name: Tauri Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri dependencies (Linux)
        # Plain apt-get, not cache-apt-pkgs-action: its cached tarball omits deps that
        # were preinstalled on the older runner image, so glib-2.0.pc went missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libglib2.0-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Run Rust tests
        run: npm run tauri:test
